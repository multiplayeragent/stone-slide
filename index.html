<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0f1c2e; }

  #msg.on { opacity: 1; transform: translateY(-50%) scale(1); }

  #sweep.on { color: #fff; animation: pulse .25s infinite alternate; }

  #hint { flex: 1; text-align: center; font-size: 14px; line-height: 1.25; }

  #curl { pointer-events: auto; min-height: 44px; min-width: 104px; padding: 0 14px; border-radius: 22px; border: 1px solid #ffffff40; background: #0b1626cc; color: #fff; font: 800 14px system-ui, sans-serif; cursor: pointer; touch-action: none; white-space: nowrap; }
  #net { bottom: max(6px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); white-space: nowrap; text-align: center; font-size: 12px; background: #0b1626b0; border-radius: 8px; padding: 1px 8px; }

  .card h2 { margin: 0 0 4px; font-size: 26px; color: #ffd84d; }
  .card h3 { margin: 14px 0 4px; font-size: 13px; color: #7fe7ff; text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  .card p { margin: 8px 0 0; font-size: 13px; opacity: .8; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #ffd84d; color: #3a2a00; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  @media (max-width: 600px) { #hint { font-size: 13px; } #msg { font-size: 30px; } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>

<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><table id="score"></table></div>
<div class="hud" id="turn"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="sweep"></div>
<div class="hud" id="bar"><div id="hint"></div><button id="curl" hidden>Curl ↻ right</button></div>
<div class="hud" id="net">Connecting…</div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><div id="overSub"></div>
  <h3>Most wins</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ STONE SLIDE · a Multiplayer Agent starter ═════════════════════════════════════════
 * Two teams slide stones down a long sheet of ice at the target. After a stone leaves the
 * hand, its team SWEEPS in front of it so it glides further and curls less. Four stones per
 * team per end, three ends; the stones closest to the button score. Versus, 2–8 players;
 * bots fill both teams.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ teams, ends, timings, the sheet, stone physics, sweeping, the bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   ICE ........... the sheet's lines and the house; one physics step for every stone (friction,
 *                   curl, sweeping, stones hitting stones, out of play); scoring an end
 *   MATCH (HOST) .. seats and teams, whose throw, starting a throw, running the sliding stones,
 *                   counting an end. Only the host writes the shared fields.
 *   BOTS .......... how a bot picks a draw, a guard or a takeout, and when bots sweep
 *   MY TURN ....... aiming, weight, curl, throwing; holding to sweep
 *   DRAW .......... the camera that follows the stone, the ice, the house, stones, brooms
 *   HUD & RESULTS . scoreboard, whose throw, call-outs, results card, leaderboard
 *   INPUT ......... drag back to throw, hold to sweep, keys, the curl button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the ice):
 *   - The match is ONE shared field, `game`: {id, v, phase: aim|slide|end|over, seats, end,
 *     thr, first, n, score, ends, turnAt, endsAt, res, win}. `seats` = every player and bot
 *     {id, n, c, t (team), bot}. Only the HOST writes it, and `v` goes up on every write.
 *   - The stones are the shared field `stones`: [{i, t, x, y, vx, vy, c}] (id, team, position,
 *     speed, curl). While stones move, the HOST simulates them and writes them ~12 times a
 *     second; everyone else runs the same physics between writes and eases into each write.
 *   - Who is sweeping right now is the shared field `sweep` {n, who: [seat numbers]}.
 *   - On your throw you aim on your own screen and write your OWN entity `aim` {n, a, w, c}
 *     (throw number, angle, weight, curl), so everyone sees your line. You also write `hb`
 *     (heartbeat), `n` and `c` (name, color).
 *   - Intents to the host: "throw" {g, n, a, w, c} (it checks it is your throw), "sweep" {n}
 *     about 5 times a second while you hold (only your team's stone), "again" (Play again).
 *   - Bots aim and sweep on the host; a bot's aim is in the shared field `bot` {n, a, w, c}.
 *   - A new host carries on from `game`, `stones` and `sweep`: the stone keeps sliding.
 *   - ?attract plays offline, bots only (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for every match your team wins, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  teamSize: 2,          // bots fill each team up to this many players ...
  maxSeats: 8,          // ... and up to 8 people play, 4 a side
  stonesPerTeam: 4,     // stones each team throws in an end
  ends: 3,              // ends in a match
  turnMs: 30000,        // a player who doesn't throw in this long gets a throw made for them
  endMs: 4500,          // ms the end's score shows before the next end
  resultsMs: 15000,     // results show this long, then a new match (Play again starts it at once)
  seatGraceMs: 10000,   // a seated player silent this long hands the seat to a bot
  simSpeed: 1,          // how fast the ice runs (1 = normal; the preview runs it faster)
  // The sheet, in metres. x runs across (-2.2..2.2); y runs from the release (0) to the far end.
  halfWidth: 2.2,
  hogY: 21.5,           // a stone must get past this line, or it is taken off
  teeY: 27.9,           // the middle of the house (the button)
  backY: 29.73,         // a stone fully past this line is out
  endY: 31.5,           // the boards at the far end
  houseR: 1.83,         // the outer ring; a stone touching it can score
  stoneR: 0.19,         // a little bigger than real stones, so they read on a phone
  // Stone physics
  friction: 1.12,       // m/s² the ice slows a stone by
  curl: 0.045,          // how hard a stone curls; it curls more as it slows (about a metre on a draw)
  curlSoft: 1.0,        // m/s: below about this speed the curl gets strong
  bounce: 0.88,         // stone-on-stone: how much speed a hit keeps
  sweepFriction: 0.12,  // sweeping cuts the friction by this share (the stone goes further) ...
  sweepCurl: 0.55,      // ... and the curl by this share (it runs straighter)
  // Throwing
  aimMax: 0.08,         // the widest angle off straight, radians
  aimScale: 0.2,        // stone angle per radian of your drag angle (lower = finer aim)
  minW: 6.6, maxW: 11.5, // m/s for the shortest and the hardest throw
  drawW: 8.6,           // the first 70% of your pull covers minW..drawW (guards and draws), the rest is for takeouts
  maxPull: 180,         // screen px you drag back for the hardest throw
  // Bots
  botThinkMs: 2200,     // a bot lines up this long before it throws
  botWeightErr: 0.025,  // how far off a bot's weight can be (share of the speed)
  botAimErr: 0.004,     // ... and its angle (radians)
  botLight: 0.04,       // bots throw draws this much light and sweep them in
  botNames: ["Brooms", "Pebble", "Hammer Hal", "Button Bea", "Hog Line Hank", "Ice Iris", "Slider Sam", "Tee Tina"],
  board: "wins",        // leaderboard name
};
const COLORS = ["#ff6b6b", "#4dabf7", "#69db7c", "#da77f2", "#ff922b", "#f783ac", "#3bc9db", "#a9e34b"];
const TEAMS = [{ name: "Red", c: "#e8313b", dark: "#8f1219" }, { name: "Yellow", c: "#ffcc1a", dark: "#a07800" }];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'stone-slide',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── ICE ─────────────────────────────────────────────────────────────────────────────
const SR = CONFIG.stoneR, HW = CONFIG.halfWidth, TEE = CONFIG.teeY;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const r3 = (v) => Math.round(v * 1000) / 1000;
const ICE_STEP = 1 / 120;
const distToTee = (s) => Math.hypot(s.x, s.y - TEE);
const inHouse = (s) => distToTee(s) - SR <= CONFIG.houseR;
const moving = (s) => s.vx !== 0 || s.vy !== 0;
/** One physics step for every stone. The stone `sweptId` glides further and curls less while `swept`. */
function iceStep(stones, dt, sweptId, swept) {
  const C = CONFIG;
  for (const s of stones) {
    if (!moving(s)) continue;
    const sw = swept && s.i === sweptId;
    let v = Math.hypot(s.vx, s.vy);
    // the curl: a push to one side, stronger as the stone slows (c = +1 curls right, -1 left)
    const lat = s.c * C.curl * (sw ? 1 - C.sweepCurl : 1) / (v + C.curlSoft) * 9.81 * dt;
    const ux = s.vx / v, uy = s.vy / v;
    s.vx += uy * lat; s.vy -= ux * lat; // sideways: to the right of where it is going for c = +1
    v = Math.hypot(s.vx, s.vy);
    const nv = v - C.friction * (sw ? 1 - C.sweepFriction : 1) * dt;
    if (nv <= 0.02) { s.vx = 0; s.vy = 0; continue; }
    s.vx *= nv / v; s.vy *= nv / v;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (Math.abs(s.x) > HW - SR) { s.x = Math.sign(s.x) * (HW - SR); s.vx = 0; s.vy *= 0.3; s.out = 1; } // touched the side: out
    if (s.y > C.endY - SR) { s.y = C.endY - SR; s.vx = s.vy = 0; s.out = 1; }                          // into the far boards
    if (s.y - SR > C.backY) s.out = 1;                                                                // past the back line
  }
  for (let pass = 0; pass < 3; pass++) for (let i = 0; i < stones.length; i++) for (let k = i + 1; k < stones.length; k++) {
    const a = stones[i], b = stones[k];
    if (!moving(a) && !moving(b)) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= 2 * SR || d < 1e-6) continue;
    const nx = dx / d, ny = dy / d, push = (2 * SR - d) / 2;
    a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
    const closing = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (closing <= 0) continue;
    const j = ((1 + C.bounce) / 2) * closing;
    a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny;
    if (closing > 0.6) hitFx((a.x + b.x) / 2, (a.y + b.y) / 2, closing);
  }
}
/** Where one stone thrown at angle a, weight w, curl c ends up on an empty sheet (or its x when it reaches y = untilY). */
function slideAlone(a, w, c, untilY = Infinity, sweep = 0) {
  const s = { i: 0, x: 0, y: 0, vx: Math.sin(a) * w, vy: Math.cos(a) * w, c }, list = [s];
  for (let t = 0; t < 20 && moving(s) && s.y < untilY; t += 1 / 60) iceStep(list, 1 / 60, 0, sweep);
  return s;
}
/** The end's score: the team with the stone nearest the button scores one for each of its stones nearer than the other team's best. */
function endScore(stones) {
  const inH = stones.filter((s) => !s.out && inHouse(s)).sort((a, b) => distToTee(a) - distToTee(b));
  if (!inH.length) return { team: -1, pts: 0, ids: [] };
  const team = inH[0].t, k = inH.findIndex((s) => s.t !== team), ids = (k < 0 ? inH : inH.slice(0, k)).map((s) => s.i);
  return { team, pts: ids.length, ids };
}

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { acting: false, last: null, ice: [], acc: 0, lastPub: 0, stillAt: 0, sweepAt: new Map(), sweepKey: "", bot: null, plan: null, predictAt: 0, botSweep: false, again: false };
/** The match as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = parseOnce("game", S.shared.game, null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const packStone = (s) => ({ i: s.i, t: s.t, x: r3(s.x), y: r3(s.y), vx: r3(s.vx), vy: r3(s.vy), c: s.c, ...(s.out ? { out: 1 } : {}) });
function writeStones() { host.lastPub = performance.now(); net.setShared("stones", JSON.stringify(host.ice.map(packStone))); }
/** Become host: carry on with the stones (still sliding, if they were). My own run of the stones since the last
 *  write is newer than that write (the old host may have frozen seconds ago), so keep it when it started from it. */
function adopt() {
  host.acting = true; host.last = null; host.bot = null; host.acc = 0; host.stillAt = 0;
  const fresh = viewRaw === S.shared.stones && view.length;
  host.ice = (fresh ? view : parse(S.shared.stones, []) || []).map((s) => ({ ...s }));
}
const humansHere = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId) && (id === net.sessionId || S.entities.players[id]?.n));
const rid = () => "b" + Math.random().toString(36).slice(2, 6);
const teamSeats = (g, t) => g.seats.map((s, i) => (s.t === t ? i : -1)).filter((i) => i >= 0);
/** A bot for team t with a name and color nobody is using. */
function botSeat(t, seats) {
  const names = new Set(seats.map((s) => s.n)), cols = new Set(seats.map((s) => (s.bot ? s.c : colorOf(s.id))));
  return { id: rid(), bot: 1, t, n: CONFIG.botNames.find((n) => !names.has(n)) || "Bot", c: COLORS.find((c) => !cols.has(c)) || "#ccc" };
}
/** The team throwing now (they alternate stones) and the seat whose throw it is (a team's players take turns). */
const throwTeam = (g) => (g.thr % 2 === 0 ? g.first : 1 - g.first);
function thrower(g) { const list = teamSeats(g, throwTeam(g)), k = Math.floor(g.thr / 2); return list[Math.floor((k * list.length) / CONFIG.stonesPerTeam)]; }
function newMatch(id) {
  const seats = [];
  humansHere().slice(0, CONFIG.maxSeats).forEach((pid, k) => seats.push({ id: pid, bot: 0, t: k % 2, n: nameOf(pid).slice(0, 16) }));
  for (const t of [0, 1]) while (seats.filter((s) => s.t === t).length < CONFIG.teamSize) seats.push(botSeat(t, seats));
  seats.sort((a, b) => a.t - b.t);
  host.ice = []; writeStones(); host.bot = null;
  return writeGame({ id, phase: "aim", seats, end: 1, thr: 0, first: 0, n: 0, score: [0, 0], ends: [], turnAt: Date.now(), endsAt: 0, res: null, win: -1 });
}
/** Gone players hand their seat to a bot; someone waiting takes a bot's seat, or a new seat. */
function fixSeats(g) {
  if (ATTRACT || g.phase === "over") return g;
  let seats = g.seats, changed = false, turnAt = g.turnAt;
  seats = seats.map((s) => { if (s.bot || stillHere(s.id)) return s; changed = true; return botSeat(s.t, seats); });
  for (const id of humansHere().filter((h) => !seats.some((s) => s.id === h))) {
    const people = (t) => seats.filter((s) => s.t === t && !s.bot).length, pref = people(0) <= people(1) ? 0 : 1;
    let j = seats.findIndex((s) => s.bot && s.t === pref); if (j < 0) j = seats.findIndex((s) => s.bot);
    if (j >= 0) { seats = seats.map((s, k) => (k === j ? { id, bot: 0, t: s.t, n: nameOf(id).slice(0, 16) } : s)); if (g.phase === "aim" && j === thrower(g)) { turnAt = Date.now(); host.bot = null; } }
    else if (seats.length < CONFIG.maxSeats) { const t = seats.filter((s) => s.t === 0).length <= seats.filter((s) => s.t === 1).length ? 0 : 1; seats = [...seats, { id, bot: 0, t, n: nameOf(id).slice(0, 16) }]; }
    else break;
    changed = true;
  }
  return changed ? writeGame({ ...g, seats, turnAt }) : g;
}
/** Check a throw and start it: the stone leaves the hack sliding. */
function startThrow(g, m) {
  const a = r3(clamp(+m.a || 0, -CONFIG.aimMax, CONFIG.aimMax)), w = r3(clamp(+m.w || 0, CONFIG.minW, CONFIG.maxW)), c = +m.c < 0 ? -1 : 1;

    for (const [x, y] of tr) ctx.lineTo(x, y);
    ctx.stroke(); ctx.lineCap = "butt";
  }
  for (const s of view) {
    const glow = res && res.ids.includes(s.i) ? (Math.sin(now / 150) > 0 ? "#ffffffaa" : "#ffd84d99") : "";
    drawStone(s, s.out ? 0.35 : 1, glow);
  }
  const thrown = view.find((s) => s.i === g.n && moving(s));
  if (thrown && sweep && sweep.n === g.n) sweep.who.forEach((k, j) => drawBroom(thrown, j % 2 ? -1 : 1, seatColor(g.seats[k]), now / 1000 + j));
  for (let i = fx.parts.length - 1; i >= 0; i--) { const p = fx.parts[i]; p.life -= dt; if (p.life <= 0) { fx.parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = p.life * 2; ctx.fillStyle = p.color; ctx.fillRect(p.x - 0.025, p.y - 0.025, 0.05, 0.05); }
  ctx.globalAlpha = 1;
}
/** The thrower's line as everyone sees it: mine live, a remote player's from its `aim`, a bot's from `bot`. */
const shownAim = { n: -1, a: 0, w: 0, c: 1 };
function aimView(g, dt) {
  if (g.phase !== "aim") return null;
  const k = thrower(g), seat = g.seats[k];
  if (!seat) return null;
  if (seat.id === me.id && myTurn(g)) return { a: me.a, w: me.w, c: me.c, mine: true, color: me.color };
  const src = seat.bot || g.turnAt + CONFIG.turnMs < Date.now() ? parse(S.shared.bot, null) : parseOnce("aim:" + seat.id, S.entities.players[seat.id]?.aim, null);
  if (shownAim.n !== g.n) Object.assign(shownAim, { n: g.n, a: 0, w: 0, c: 1 });
  if (src && src.n === g.n) { const e = 1 - Math.exp(-dt * 10); shownAim.a += (src.a - shownAim.a) * e; shownAim.w += (src.w - shownAim.w) * e; shownAim.c = src.c; }
  return shownAim.w > 0 ? { ...shownAim, mine: false, color: seatColor(seat) } : null;

// Sound: tiny WebAudio sounds, started by the first touch or click.
let audio = null, sweepNoise = null;
function sfx(kind, power = 1) {
  if (!audio || ATTRACT) return;
  const [type, f0, f1, len, vol] = { clack: ["triangle", 900, 300, 0.12, 0.1 + power * 0.3], throw: ["sine", 120, 70, 0.4, 0.2], turn: ["triangle", 520, 880, 0.16, 0.06], score: ["square", 440, 880, 0.35, 0.08], win: ["sawtooth", 330, 990, 0.6, 0.12] }[kind];
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + len + 0.02);
}
/** The scrub of brooms on ice: filtered noise, on while anyone sweeps. */
function setSweepSound(on) {
  if (!audio || ATTRACT) return;
  if (!sweepNoise) {
    const buf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = buf; src.loop = true; f.type = "bandpass"; f.frequency.value = 2400; g.gain.value = 0;
    src.connect(f).connect(g).connect(audio.destination); src.start(); sweepNoise = g;
  }
  sweepNoise.gain.setTargetAtTime(on ? 0.12 : 0, audio.currentTime, 0.05);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, msgTimer = 0, resSeen = null, dropped = false, scoreKey = "";
function toast(html, ms = 2200) { const m = $("msg"); m.innerHTML = html; m.classList.add("on"); clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove("on"), ms); }
const teamNames = (g, t) => teamSeats(g, t).map((i) => (g.seats[i].id === me.id ? "You" : seatName(g.seats[i])));
/** Stones a team still has to throw this end. */
const stonesLeft = (g, t) => { let n = 0; for (let k = g.thr + (g.phase === "slide" ? 1 : 0); k < 2 * CONFIG.stonesPerTeam; k++) if ((k % 2 === 0 ? g.first : 1 - g.first) === t) n++; return g.phase === "aim" || g.phase === "slide" ? n : 0; };
function scoreHtml(g) {
  const cur = g.phase === "aim" || g.phase === "slide" ? throwTeam(g) : -1;
  return [0, 1].map((t) => {
    const ends = Array.from({ length: CONFIG.ends }, (_, k) => `<td class="end ${k === g.end - 1 && g.phase !== "over" ? "now" : ""}">${g.ends[k] ? g.ends[k][t] : ""}</td>`).join("");
    const left = "●".repeat(stonesLeft(g, t)) + "○".repeat(CONFIG.stonesPerTeam - stonesLeft(g, t));
    return `<tr class="${t === cur ? "now" : ""}"><td class="nm"><i style="background:${TEAMS[t].c}"></i>${esc(teamNames(g, t).join(", "))}</td><td class="st" style="color:${TEAMS[t].c}">${left}</td>${ends}<td class="tot">${g.score[t]}</td></tr>`;
  }).join("");
}
function hud(g, now) {
  const resKey = g.res ? g.id + ":" + g.res.end : resSeen ?? "";
  if (resKey !== resSeen && resSeen !== null && g.res && !ATTRACT) { toast(g.res.pts ? `${TEAMS[g.res.team].name} +${g.res.pts}<small>End ${g.res.end}</small>` : `Blank end<small>No stone in the house</small>`, 3000); sfx("score"); }
  resSeen = resKey;
  const sweepState = parseOnce("sweep", S.shared.sweep, null), sweepingNow = !!(sweepState && sweepState.n === g.n && sweepState.who.length && g.phase === "slide");
  setSweepSound(sweepingNow);
  if (ATTRACT) { for (const id of ["score", "turn", "hint", "net", "sweep"]) $(id).textContent = ""; $("over").hidden = true; return; }
  const key = [g.v, me.color, JSON.stringify(g.seats.map((s) => seatName(s)))].join("|");
  if (key !== scoreKey) { scoreKey = key; $("score").innerHTML = scoreHtml(g); }
  const k = thrower(g), seat = g.seats[k], mine = myTurn(g), left = Math.ceil((g.turnAt + CONFIG.turnMs - Date.now()) / 1000), i = mySeat(g);
  const lastStone = g.thr === 2 * CONFIG.stonesPerTeam - 1 ? " · last stone" : "";
  $("turn").className = "hud" + (mine ? " mine" : "");
  $("turn").innerHTML = g.phase === "aim" ? `${mine ? (me.w ? `${weightName(me.w)} · curl ${me.c > 0 ? "right" : "left"}` : "Your throw") : `${esc(seatName(seat))} is throwing`}<small>End ${g.end} of ${CONFIG.ends} · ${TEAMS[throwTeam(g)].name} stone ${Math.floor(g.thr / 2) + 1} of ${CONFIG.stonesPerTeam}${lastStone}${mine && left <= 10 ? ` · throwing for you in ${Math.max(0, left)}s` : ""}</small>` :
    g.phase === "slide" ? `${TEAMS[throwTeam(g)].name} stone sliding<small>End ${g.end} of ${CONFIG.ends}</small>` : g.phase === "end" ? `End ${g.end} done` : "";
  const sweepMine = canSweep(g) && view.some((s) => s.i === g.n && moving(s));
  $("sweep").textContent = sweepMine ? (sweepHeld() ? "SWEEPING!" : "HOLD TO SWEEP") : "";
  $("sweep").className = "hud" + (sweepMine && sweepHeld() ? " on" : "");
  const touch = matchMedia("(pointer: coarse)").matches;
  $("hint").textContent = i < 0 && g.phase !== "over" ? "You're watching. You get a seat when a bot's seat is free, or next match." :
    mine && me.throws < 2 ? (touch ? "Drag back to aim and set the weight, let go to throw. Then hold to sweep." : "Drag back to aim and set the weight, let go to throw · then hold Space or the mouse to sweep") :
    sweepMine && me.sweeps < 4 ? "Sweeping makes the stone go further and curl less." : "";
  $("curl").hidden = !mine;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the ice" : ""}`;
  $("over").hidden = g.phase !== "over";
  if (g.phase === "over") {
    const myTeam = i >= 0 ? g.seats[i].t : -1;
    $("overTitle").textContent = g.win < 0 ? "It's a tie!" : g.win === myTeam ? "You win!" : `${TEAMS[g.win].name} wins!`;
    $("overSub").textContent = `${TEAMS[0].name} ${g.score[0]} – ${g.score[1]} ${TEAMS[1].name}` + (g.win >= 0 ? ` · ${teamNames(g, g.win).join(", ")}` : "");
    $("next").textContent = `New match in ${Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000))}s`;
    if (me.shownFor !== g.id) { me.shownFor = g.id; showBoard(g.win >= 0 && g.win === myTeam); sfx("win"); }
  }
}
function showBoard(won) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
// On your throw: press anywhere and drag BACK (toward yourself); the line points where the
// stone goes, the further you pull the harder it slides. Let go to throw. While your team's
// stone slides: hold anywhere (or Space) to sweep.
const keys = new Set();
let drag = null;
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { audio ||= new AudioContext(); } catch {}
  me.holding = true;
  const g = game();
  if (!g || !myTurn(g) || drag) return;
  cv.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY };
});
cv.addEventListener("pointermove", (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const g = game(); if (!g || !myTurn(g)) { drag = null; return; }
  const dx = drag.sx - e.clientX, dy = drag.sy - e.clientY, len = Math.hypot(dx, dy);
  if (len < 12) { me.w = 0; return; }
  const wx = M[0] * dx + M[2] * dy, wy = M[1] * dx + M[3] * dy; // the pull, turned into a direction on the sheet
  me.a = clamp(Math.atan2(wx, Math.max(0.01, wy)) * CONFIG.aimScale, -CONFIG.aimMax, CONFIG.aimMax);
  me.w = wy <= 0 ? 0 : weightFor(clamp((len - 12) / CONFIG.maxPull, 0, 1));
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => {
  me.holding = false;
  if (!drag || drag.id !== e.pointerId) return;
  drag = null;
  if (ev === "pointerup" && me.w >= CONFIG.minW) throwStone(); else me.w = 0;
});
addEventListener("keydown", (e) => {
  const k = e.key, g = game();
  try { audio ||= new AudioContext(); } catch {}
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(k)) e.preventDefault();
  keys.add(k);
  if (!g || !myTurn(g)) return;
  if (k === "ArrowLeft") me.a = clamp(me.a - 0.002, -CONFIG.aimMax, CONFIG.aimMax);
  if (k === "ArrowRight") me.a = clamp(me.a + 0.002, -CONFIG.aimMax, CONFIG.aimMax);
  if (k === "ArrowUp") me.w = clamp((me.w || CONFIG.minW) + 0.1, CONFIG.minW, CONFIG.maxW);
  if (k === "ArrowDown") me.w = clamp((me.w || CONFIG.minW) - 0.1, CONFIG.minW, CONFIG.maxW);
  if (k === "c" || k === "C") setCurl(-me.c);
  if (k === "Enter") { if (!me.w) me.w = 8; throwStone(); }
});
addEventListener("keyup", (e) => keys.delete(e.key));
addEventListener("blur", () => { keys.clear(); me.holding = false; });
$("curl").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); setCurl(-me.c); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
// Everyone but the host runs the stones from each `stones` write, easing out the jump.
let view = [], viewRaw = null;
const ease = new Map(); // stone id -> {dx, dy}: how far the drawn stone is from the simulated one
function syncView(g, dt) {
  if (host.acting) { view = host.ice; return; }
  if (S.shared.stones !== viewRaw) {
    viewRaw = S.shared.stones;
    const fresh = (parse(viewRaw, []) || []).map((s) => ({ ...s })), old = new Map(view.map((s) => [s.i, s]));
    for (const s of fresh) { const o = old.get(s.i); if (o) { const e = ease.get(s.i) || { dx: 0, dy: 0 }; e.dx += o.x - s.x; e.dy += o.y - s.y; if (Math.hypot(e.dx, e.dy) > 1) { e.dx = 0; e.dy = 0; } ease.set(s.i, e); s.spin = o.spin; } }
    view = fresh;
  }
  if (g.phase === "slide") { const sw = parseOnce("sweep", S.shared.sweep, null); iceStep(view, dt * CONFIG.simSpeed, g.n, !!(sw && sw.n === g.n && sw.who.length)); }
}
/** The stones as drawn: the host's own simulation, or everyone else's eased toward the latest write. */
function shownStones(view, dt) {
  if (host.acting) return view;
  return view.map((s) => { const e = ease.get(s.i); if (!e) return s; e.dx *= Math.exp(-dt * 8); e.dy *= Math.exp(-dt * 8); return { ...s, x: s.x + e.dx, y: s.y + e.dy }; });
}
let last = performance.now(), lastHb = 0, lastHud = 0, gameId = -1;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.acting = false; host.last = null; host.bot = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const g = game();
  if (!g) return;
  if (g.id !== gameId) { gameId = g.id; drag = null; me.turnKey = ""; view = []; viewRaw = null; }
  syncView(g, dt);
  for (const s of view) if (moving(s)) s.spin = (s.spin || 0) + (s.c || 1) * dt * 1.5;
  myTick(g, now);
  moveCamera(g, view, dt);
  updateTrails(shownStones(view, dt));
  draw(g, shownStones(view, 0), parseOnce("sweep", S.shared.sweep, null), dt, now);
  if (now - lastHud > 120) { lastHud = now; hud(g, now); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("throw", (m, from) => { if (host.acting && m) hostThrow(from, m); });
  net.on("sweep", (m, from) => { const g = game(); if (host.acting && m && g && +m.n === g.n) host.sweepAt.set(from, performance.now()); });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  me.id = net.sessionId;
  const g0 = parse(S.shared.game, null), taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(g0 ? g0.seats.filter((s) => s.bot).map((s) => s.c) : [])]);
  me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) { Object.assign(CONFIG, { botThinkMs: 700, endMs: 1500, resultsMs: 2000, simSpeed: 1.7, botLight: 0.07 }); fit(); }
  requestAnimationFrame(frame);
})();
</script>
